<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="一个关于个人经历、创造与长期兴趣收藏的数字空间。"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>个人数字空间</title>
    <script>
      document.documentElement.classList.add('js')
      try {
        const savedTheme = localStorage.getItem('personal-space-theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = savedTheme || (prefersDark ? 'dark' : 'light')
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <!--
      THESIS: A personal archive reveals itself quietly; it refuses the centered portfolio hero and uniform card grid.
      OWN-WORLD: Warm white, charcoal, one muted mint accent, fine rules, editorial spacing, and one full-width inverse shelf scene.
      STORY: Visitors understand who lives here, follow the journey, then browse games, books, music, and films without encountering invented facts.
      FIRST VIEWPORT: A large left-aligned statement occupies eight columns; a live status note anchors the lower-right; two clear routes sit below the copy.
      FORM: Asymmetric editorial archive, chosen from the confirmed Quiet Reveal direction; seed key quiet-reveal-v1.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
